# Aggiorna i bandi aperti da inPA, li salva in data/bandi.json (letto da index.html)
# e manda le notifiche dei bandi nuovi (Telegram/email) secondo i filtri NOTIFICA_*.
# Gira da solo 4 volte al giorno; si può avviare a mano da Actions -> "Aggiorna concorsi" -> Run workflow.
name: Aggiorna concorsi

on:
  schedule:
    - cron: "23 4,10,15,20 * * *"   # UTC: circa 5-6, 11-12, 16-17, 21-22 ora italiana
  workflow_dispatch:
    inputs:
      max_nuovi:
        description: "Quanti bandi nuovi analizzare in questo giro (primo giro: 2000)"
        required: false
        default: "400"
      probe:
        description: "Scrivi 'si' per stampare solo un record grezzo dell'API (diagnostica)"
        required: false
        default: ""

permissions:
  contents: write

concurrency: aggiorna-concorsi

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: pip install requests pypdf fonttools

      - name: Diagnostica API
        if: ${{ github.event.inputs.probe == 'si' }}
        run: python aggiorna.py --probe

      - name: Scarica e analizza i bandi
        id: aggiorna
        if: ${{ github.event.inputs.probe != 'si' }}
        env:
          MAX_NUOVI: ${{ github.event.inputs.max_nuovi || '400' }}
          REGIONI: ""          # es. "Campania" per analizzare i PDF solo di quella regione
        run: python aggiorna.py

      - name: Notifiche bandi nuovi
        if: ${{ steps.aggiorna.outcome == 'success' }}
        env:
          # --- i tuoi filtri (modificali qui) ---
          NOTIFICA_REGIONI: "Campania"
          NOTIFICA_LAUREA: "L-31"
          NOTIFICA_COMPAT: "forse"          # "si" = solo compatibili certi, "forse" = anche da verificare
          NOTIFICA_PROVE: ""                # es. "solo_scritto,scritto_orale"
          NOTIFICA_CONTRATTO: ""            # es. "indeterminato"
          NOTIFICA_NO_PRESELETTIVA: "0"     # "1" = escludi bandi con preselettiva
          # --- canali: si configurano in Settings -> Secrets and variables -> Actions ---
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python notifica.py

      - name: Salva i dati nel repository
        if: ${{ always() && github.event.inputs.probe != 'si' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessuna novita'"
          else
            git commit -m "Aggiornamento bandi $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
