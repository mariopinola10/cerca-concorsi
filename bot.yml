# Bot Telegram: risponde ai messaggi (comandi e link dei filtri dalla pagina) e salva i filtri
# delle notifiche in data/notifiche.json.
# - con il Worker Cloudflare (cloudflare/worker.js) parte subito a ogni messaggio (repository_dispatch);
# - senza Worker legge i messaggi in coda ogni ~15 minuti (GitHub puo' ritardare i giri programmati).
name: Bot Telegram

on:
  repository_dispatch:
    types: [telegram]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # ogni messaggio dal Worker ha il suo run (nessun messaggio scartato); i giri programmati non si sovrappongono
  group: bot-${{ github.event_name == 'repository_dispatch' && github.run_id || 'coda' }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: pip install requests

      - name: Leggi i messaggi e rispondi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Salva la configurazione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notifiche.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Bot: filtri notifiche aggiornati"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
